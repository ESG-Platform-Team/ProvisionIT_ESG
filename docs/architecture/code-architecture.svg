<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4E5C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A12"/></marker>
</defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0E0F14">Code architecture: layers and key modules</text>
<text x="40" y="70" font-size="14" fill="#565C6C">Where to look when changing something. File names are in the repository; the frontend and API meet at a frozen JSON contract.</text>

<!-- Frontend layer -->
<rect x="40" y="92" width="1120" height="104" rx="14" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="60" y="118" font-size="13" font-weight="700" fill="#565C6C">FRONTEND · frontend/ · static React, vendored, no build step</text>
<g font-size="12" text-anchor="middle">
<rect x="60" y="130" width="560" height="52" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="340" y="152" font-weight="600" fill="#0E0F14">index.html: six screens</text>
<text x="340" y="170" fill="#565C6C">Search · Retrieval log · Scorecard · Insufficient · History · Requests</text>
<rect x="640" y="130" width="190" height="52" rx="8" fill="#0E0F14"/>
<text x="735" y="152" font-weight="600" fill="#F4BF3F">backend.js</text>
<text x="735" y="170" fill="#F4F5F7">only file that calls the API</text>
<rect x="850" y="130" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#8A8F9C"/>
<text x="995" y="152" font-weight="600" fill="#0E0F14">scraper.js · support.js · analytics.js</text>
<text x="995" y="170" fill="#565C6C">demo data · helpers · PostHog (off by default)</text>
</g>

<line x1="735" y1="182" x2="735" y2="222" stroke="#8A6A12" stroke-width="2" marker-end="url(#g)"/>
<text x="722" y="208" font-size="12" font-weight="600" text-anchor="end" fill="#8A6A12">JSON over HTTPS · JWT bearer token · contract: frontend/CONNECTING.md</text>

<!-- API layer -->
<rect x="40" y="226" width="1120" height="80" rx="14" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="60" y="252" font-size="13" font-weight="700" fill="#565C6C">API · backend/app/</text>
<g font-size="12" text-anchor="middle">
<rect x="200" y="238" width="420" height="54" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="410" y="260" font-weight="600" fill="#0E0F14">main.py: FastAPI routes</text>
<text x="410" y="278" font-size="11" fill="#565C6C">/api/assessments · /api/companies · /api/disclosure-requests · /respond</text>
<rect x="640" y="238" width="250" height="54" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="765" y="260" font-weight="600" fill="#0E0F14">auth.py</text>
<text x="765" y="278" font-size="11" fill="#565C6C">PBKDF2 · JWT issue, check, revoke</text>
<rect x="910" y="238" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="1025" y="260" font-weight="600" fill="#0E0F14">disclosure.py · contacts.py</text>
<text x="1025" y="278" fill="#565C6C">requests · upload page · contacts</text>
</g>

<line x1="410" y1="292" x2="410" y2="330" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>

<!-- Pipeline layer -->
<rect x="40" y="334" width="1120" height="190" rx="14" fill="#FFFFFF" stroke="#0E0F14" stroke-width="1.4"/>
<text x="60" y="360" font-size="13" font-weight="700" fill="#0E0F14">ASSESSMENT PIPELINE · pipeline.py orchestrates one run, holds live progress (RunState)</text>
<g font-size="12" text-anchor="middle">
<rect x="60" y="378" width="230" height="78" rx="8" fill="#F4F5F7" stroke="#4A4E5C"/>
<text x="175" y="400" font-weight="700" fill="#0E0F14">1 Harvest</text><text x="175" y="418" fill="#0E0F14">harvest.py</text><text x="175" y="436" fill="#565C6C">crawl site · robots.txt</text><text x="175" y="450" fill="#565C6C">newest edition only</text>
<rect x="330" y="378" width="230" height="78" rx="8" fill="#F4F5F7" stroke="#4A4E5C"/>
<text x="445" y="400" font-weight="700" fill="#0E0F14">2 Extract</text><text x="445" y="418" fill="#0E0F14">textract.py</text><text x="445" y="436" fill="#565C6C">page-numbered text</text><text x="445" y="450" fill="#565C6C">pdfplumber · pypdf</text>
<rect x="600" y="378" width="230" height="78" rx="8" fill="#F4F5F7" stroke="#4A4E5C"/>
<text x="715" y="400" font-weight="700" fill="#0E0F14">3 Read</text><text x="715" y="418" fill="#0E0F14">llm.py</text><text x="715" y="436" fill="#565C6C">Gemini quotes per principle</text><text x="715" y="450" fill="#565C6C">JSON schema · cache · fallback</text>
<rect x="870" y="378" width="270" height="78" rx="8" fill="#0E0F14"/>
<text x="1005" y="400" font-weight="700" fill="#F4BF3F">4 Score (deterministic)</text><text x="1005" y="418" fill="#F4F5F7">scoring.py · no model called here</text><text x="1005" y="436" fill="#9AA0AE">Practice band · Transparency</text><text x="1005" y="450" fill="#9AA0AE">confidence A to E · decline &lt;55%</text>
</g>
<g stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"><line x1="290" y1="417" x2="328" y2="417"/><line x1="560" y1="417" x2="598" y2="417"/><line x1="830" y1="417" x2="868" y2="417"/></g>
<rect x="850" y="470" width="290" height="40" rx="8" fill="#FDF3D8" stroke="#8A6A12"/>
<text x="995" y="487" font-size="12" font-weight="600" text-anchor="middle" fill="#0E0F14">matrix*.py · pillars.py</text>
<text x="995" y="502" font-size="11" text-anchor="middle" fill="#565C6C">criteria · keywords · weights · DRAFT flag</text>
<rect x="60" y="470" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#8A8F9C"/>
<text x="310" y="495" font-size="12" text-anchor="middle" fill="#0E0F14"><tspan font-weight="600">Output:</tspan> report.py (PDF, ReportLab) · mailer.py (SMTP or saved outbox)</text>

<line x1="410" y1="524" x2="410" y2="566" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>

<!-- Data layer -->
<rect x="40" y="570" width="1120" height="120" rx="14" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="60" y="596" font-size="13" font-weight="700" fill="#565C6C">DATA · store.py · db.py (SQLAlchemy) · companies.py</text>
<g font-size="12" text-anchor="middle">
<rect x="60" y="610" width="520" height="62" rx="8" fill="#FDF3D8" stroke="#8A6A12"/>
<text x="320" y="634" font-weight="600" fill="#0E0F14">PostgreSQL in production · SQLite on a laptop</text>
<text x="320" y="654" font-size="11" fill="#565C6C">10 tables: users, companies, assessment_runs, pillar_results,</text>
<text x="320" y="668" font-size="11" fill="#565C6C">source_documents, disclosure requests and items, email_log ...</text>
<rect x="610" y="610" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#8A8F9C"/>
<text x="875" y="634" font-weight="600" fill="#0E0F14">Every issued result stored exactly as returned</text>
<text x="875" y="654" fill="#565C6C">so any report can be reproduced</text>
<text x="875" y="668" fill="#565C6C">Schema and ER diagram: docs/database.md</text>
</g>
</svg>
