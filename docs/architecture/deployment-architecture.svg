<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4E5C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A12"/></marker>
</defs>
<rect width="1200" height="760" fill="#FFFFFF"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#0E0F14">Deployment architecture: how the code reaches production</text>
<text x="40" y="70" font-size="14" fill="#565C6C">Left: hosting today (Cloudflare and Neon). Right: the same Docker image on AWS (docs/deploy-aws.md). Bottom: the release pipeline.</text>

<!-- Cloudflare panel -->
<rect x="40" y="92" width="540" height="430" rx="14" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="60" y="122" font-size="15" font-weight="700" fill="#0E0F14">TODAY: Cloudflare + Neon (live)</text>
<text x="60" y="142" font-size="12" fill="#6A6F7D">provisionit-esg.provisionit-esg.workers.dev · about US$5 a month</text>

<rect x="200" y="160" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="310" y="187" font-size="14" text-anchor="middle" fill="#0E0F14">Analyst's browser</text>

<rect x="160" y="236" width="300" height="56" rx="8" fill="#0E0F14"/>
<text x="310" y="259" font-size="14" font-weight="600" text-anchor="middle" fill="#F4BF3F">Cloudflare Worker</text>
<text x="310" y="279" font-size="12" text-anchor="middle" fill="#F4F5F7">cloudflare/src/index.js · routes by path</text>

<rect x="60" y="330" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="160" y="355" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">Static assets</text>
<text x="160" y="376" font-size="12" text-anchor="middle" fill="#565C6C">frontend/ (no build step)</text>

<rect x="300" y="330" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="430" y="355" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">API container (1 instance)</text>
<text x="430" y="376" font-size="12" text-anchor="middle" fill="#565C6C">backend/Dockerfile · FastAPI · TST fixture</text>

<rect x="300" y="430" width="260" height="56" rx="8" fill="#FDF3D8" stroke="#8A6A12"/>
<text x="430" y="454" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">Neon PostgreSQL</text>
<text x="430" y="474" font-size="12" text-anchor="middle" fill="#565C6C">accounts, runs, requests, uploads</text>

<rect x="60" y="430" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8A8F9C" stroke-dasharray="5 4"/>
<text x="160" y="454" font-size="13" font-weight="600" text-anchor="middle" fill="#0E0F14">Cloudflare secrets</text>
<text x="160" y="474" font-size="11" text-anchor="middle" fill="#565C6C">DATABASE_URL, JWT, GEMINI, SMTP</text>

<line x1="310" y1="204" x2="310" y2="234" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="250" y1="292" x2="175" y2="328" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="200" y="314" font-size="11" text-anchor="end" fill="#565C6C">everything else</text>
<line x1="380" y1="292" x2="420" y2="328" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="410" y="314" font-size="11" fill="#565C6C">/api/*  /respond/*</text>
<line x1="430" y1="392" x2="430" y2="428" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="260" y1="458" x2="298" y2="370" stroke="#8A8F9C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>

<!-- AWS panel -->
<rect x="620" y="92" width="540" height="430" rx="14" fill="#FFFFFF" stroke="#DCDEE4" stroke-dasharray="6 5"/>
<text x="640" y="122" font-size="15" font-weight="700" fill="#0E0F14">OPTION: AWS (Stage 1, same image)</text>
<text x="640" y="142" font-size="12" fill="#6A6F7D">ap-southeast-2 · about US$60 to 65 a month · no code changes</text>

<rect x="780" y="160" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="890" y="187" font-size="14" text-anchor="middle" fill="#0E0F14">Analyst's browser</text>

<rect x="740" y="236" width="300" height="56" rx="8" fill="#0E0F14"/>
<text x="890" y="259" font-size="14" font-weight="600" text-anchor="middle" fill="#F4BF3F">CloudFront (HTTPS)</text>
<text x="890" y="279" font-size="12" text-anchor="middle" fill="#F4F5F7">same path routing as the Worker</text>

<rect x="640" y="330" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="740" y="355" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">S3 bucket</text>
<text x="740" y="376" font-size="12" text-anchor="middle" fill="#565C6C">frontend/ · private (OAC)</text>

<rect x="880" y="330" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#0E0F14"/>
<text x="1010" y="355" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">ALB → ECS Fargate (1 task)</text>
<text x="1010" y="376" font-size="12" text-anchor="middle" fill="#565C6C">image from ECR · port 8080</text>

<rect x="880" y="430" width="260" height="56" rx="8" fill="#FDF3D8" stroke="#8A6A12"/>
<text x="1010" y="454" font-size="14" font-weight="600" text-anchor="middle" fill="#0E0F14">RDS PostgreSQL</text>
<text x="1010" y="474" font-size="12" text-anchor="middle" fill="#565C6C">private subnet · 7-day backups</text>

<rect x="640" y="430" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#8A8F9C" stroke-dasharray="5 4"/>
<text x="740" y="454" font-size="13" font-weight="600" text-anchor="middle" fill="#0E0F14">Secrets Manager · SES</text>
<text x="740" y="474" font-size="11" text-anchor="middle" fill="#565C6C">keys · email over SMTP</text>

<line x1="890" y1="204" x2="890" y2="234" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="830" y1="292" x2="755" y2="328" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="780" y="314" font-size="11" text-anchor="end" fill="#565C6C">everything else</text>
<line x1="960" y1="292" x2="1000" y2="328" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="990" y="314" font-size="11" fill="#565C6C">/api/*  /respond/*</text>
<line x1="1010" y1="392" x2="1010" y2="428" stroke="#4A4E5C" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="840" y1="458" x2="878" y2="370" stroke="#8A8F9C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>

<!-- external services strip -->
<text x="40" y="552" font-size="12" font-weight="600" fill="#565C6C">BOTH CALL OUT TO</text>
<rect x="160" y="536" width="262" height="26" rx="13" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="291" y="553" font-size="12" text-anchor="middle" fill="#0E0F14">Company websites (robots.txt, 1.5 s delay)</text>
<rect x="436" y="536" width="230" height="26" rx="13" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="551" y="553" font-size="12" text-anchor="middle" fill="#0E0F14">Google Gemini API (quotes only)</text>
<rect x="680" y="536" width="200" height="26" rx="13" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="780" y="553" font-size="12" text-anchor="middle" fill="#0E0F14">SMTP email (optional)</text>
<rect x="894" y="536" width="190" height="26" rx="13" fill="#F4F5F7" stroke="#DCDEE4"/>
<text x="989" y="553" font-size="12" text-anchor="middle" fill="#0E0F14">PostHog (optional)</text>

<!-- CI/CD pipeline -->
<rect x="40" y="584" width="1120" height="150" rx="14" fill="#0E0F14"/>
<text x="60" y="614" font-size="15" font-weight="700" fill="#F4BF3F">RELEASE PIPELINE (GitHub Actions)</text>
<g font-size="12" fill="#F4F5F7" text-anchor="middle">
<rect x="60" y="634" width="150" height="70" rx="8" fill="#22252F" stroke="#4A4E5C"/>
<text x="135" y="660" font-weight="600">Feature branch</text><text x="135" y="680" fill="#9AA0AE">PR + teammate</text><text x="135" y="695" fill="#9AA0AE">review</text>
<rect x="240" y="634" width="190" height="70" rx="8" fill="#22252F" stroke="#4A4E5C"/>
<text x="335" y="660" font-weight="600">CI (ci.yml)</text><text x="335" y="680" fill="#9AA0AE">ruff · 399 tests · 9 browser</text><text x="335" y="695" fill="#9AA0AE">tests · secret scan · image build</text>
<rect x="460" y="634" width="150" height="70" rx="8" fill="#22252F" stroke="#4A4E5C"/>
<text x="535" y="660" font-weight="600">Merge to main</text><text x="535" y="680" fill="#9AA0AE">ruleset: PR + green</text><text x="535" y="695" fill="#9AA0AE">"tests" check</text>
<rect x="640" y="634" width="150" height="70" rx="8" fill="#22252F" stroke="#F4BF3F"/>
<text x="715" y="660" font-weight="600" fill="#F4BF3F">Approval gate</text><text x="715" y="680" fill="#9AA0AE">"production"</text><text x="715" y="695" fill="#9AA0AE">environment</text>
<rect x="820" y="634" width="150" height="70" rx="8" fill="#22252F" stroke="#4A4E5C"/>
<text x="895" y="660" font-weight="600">Deploy</text><text x="895" y="680" fill="#9AA0AE">wrangler deploy</text><text x="895" y="695" fill="#9AA0AE">or deploy-aws.yml</text>
<rect x="1000" y="634" width="140" height="70" rx="8" fill="#22252F" stroke="#4A4E5C"/>
<text x="1070" y="660" font-weight="600">Smoke test</text><text x="1070" y="680" fill="#9AA0AE">smoke_test.sh</text><text x="1070" y="695" fill="#9AA0AE">rollback if red</text>
</g>
