name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Offline tests
        run: |
          status=0
          for t in test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
