name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

jobs:
  tests:
    # Lint, then every offline test: unit, API and the acceptance tests that
    # are named after the user stories (backend/test_acceptance.py).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Offline tests
        env:
          ACCEPTANCE_REPORT: ${{ github.workspace }}/acceptance-report.json
        run: |
          status=0
          for t in test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report.json
          if-no-files-found: ignore

  e2e:
    # The analyst journey in a real browser against the real API, offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          cd e2e && npm install --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Start the fixture company, API and website
        env:
          DATABASE_URL: sqlite:////tmp/e2e.db
          JWT_SECRET: ci-only-secret-for-end-to-end-tests-not-used-anywhere-else
          MAIL_DIR: /tmp/e2e-mail
          RESPONSE_DIR: /tmp/e2e-responses
        run: |
          (cd backend/fixture-site && python -m http.server 8123 > /dev/null 2>&1 &)
          (cd backend && uvicorn app.main:app --port 8080 > /tmp/api.log 2>&1 &)
          (cd frontend && python -m http.server 8001 > /dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health > /dev/null && break; sleep 1; done
          curl -sf localhost:8080/api/health

      - name: End-to-end tests
        working-directory: e2e
        run: npm test

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

  checks:
    # Fast checks that need no install: no committed secrets, and every
    # browser and Worker script parses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: No committed secrets
        run: bash scripts/check_secrets.sh

      - name: Frontend and Worker scripts parse
        run: |
          for f in frontend/*.js cloudflare/src/*.js; do
            node --experimental-default-type=module --check "$f" && echo "ok $f"
          done

  container:
    # The image Cloudflare runs. Building it here catches a broken Dockerfile
    # or requirement before anyone deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build --platform linux/amd64 -t provisionit-esg-api backend

      - name: Worker bundles
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx esbuild src/index.js --bundle --format=esm --platform=neutral --external:'cloudflare:*' --outfile=/tmp/worker.js
