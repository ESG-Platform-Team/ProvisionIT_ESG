name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Offline tests
        run: |
          status=0
          for t in test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  container:
    # The image Cloudflare runs. Building it here catches a broken Dockerfile
    # or requirement before anyone deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build --platform linux/amd64 -t provisionit-esg-api backend

      - name: Worker bundles
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx esbuild src/index.js --bundle --format=esm --platform=neutral --external:'cloudflare:*' --outfile=/tmp/worker.js
