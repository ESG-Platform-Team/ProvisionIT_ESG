name: Deploy

# Continuous deployment to Cloudflare. Runs only after CI has passed on main,
# waits for approval on the "production" environment, deploys, then runs the
# smoke test against the live site. Can also be started by hand from the
# Actions tab (for example to redeploy after changing a secret).
#
# One-time setup (repository Settings):
#   Secrets and variables > Actions > New repository secret
#     CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#     CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
#   Environments > New environment "production" > Required reviewers: Agam
# App secrets (DATABASE_URL, JWT_SECRET, GEMINI_API_KEY, SMTP_*) stay in
# Cloudflare (npx wrangler secret put ...) and are never stored in GitHub.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  SITE_URL: https://provisionit-esg.provisionit-esg.workers.dev

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Deploy the Worker, website and API container
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${{ github.sha }} ${{ github.event.workflow_run.head_commit.message || 'manual deploy' }}"

      - name: Record the release
        run: |
          {
            echo "### Deployed"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Site: ${{ env.SITE_URL }}"
            echo "- Roll back: \`cd cloudflare && npx wrangler rollback\` (lists recent versions)"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the live site
        run: bash scripts/smoke_test.sh "$SITE_URL"
